events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 5173;
        server_name localhost;

        # Disable caching for HTML
        location = /index.html {
            root /app/dist;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires -1;
        }

        # Serve static files with cache busting
        location /assets/ {
            root /app/dist;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Serve other static files
        location / {
            root /app/dist;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # API URLs configuration endpoint
        location = /api/urls {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            return 200 '{
                "webSocketUrl": "ws://localhost:30173/repository/sse",
                "indexUrl": "http://localhost:30173/repository",
                "repositoryUrl": "http://localhost:30173/repository",
                "repositoryEventsUrl": "http://localhost:30173/repository/sse",
                "contentApiUrl": "http://localhost:30173/repository",
                "spellcheckUrl": "http://localhost:30173/repository",
                "userUrl": "http://localhost:30173/repository"
            }';
        }

        # Proxy repository API
        location /repository/ {
            proxy_pass http://elephant-repository:1080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
